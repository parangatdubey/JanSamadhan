    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JanSamadhan (जनसमाधान) – AI-Powered Digital Citizen Grievance Redressal System</title>
    <meta name="description" content="JanSamadhan empowers every citizen to raise their voice, report civic issues in native languages, and track complaints through a transparent, AI-driven grievance redressal platform." />
    <meta name="theme-color" content="#102A43" />
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- GitHub Pages Single Page App Redirect Handler (spa-github-pages) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
